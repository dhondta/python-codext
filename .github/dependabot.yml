version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # dependencies are minimum versions (>=) ; only open security updates, not routine upgrades
    open-pull-requests-limit: 0
