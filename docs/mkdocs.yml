site_author: dhondta
site_name: "Codext - Extension of native codecs for Python"
site_description: Python library extending the native codecs with many new encodings, a guess mode and CLI tools
site_url: https://python-codext.readthedocs.io
repo_url: https://github.com/dhondta/python-codext
edit_uri: edit/main/docs/pages/
copyright: Copyright &copy; 2021 Alexandre D'Hondt
docs_dir: pages
nav:
  - Home: index.md
  - Features: features.md
  - 'Guess mode': guessing.md
  - Encodings:
    - Base: enc/base.md
    - Binary: enc/binary.md
    - Ciphers: enc/ciphers.md
    - Common: enc/common.md
    - Compressions: enc/compressions.md
    - Esoteric: enc/esoteric.md
    - Frequency: enc/frequency.md
    - Hashing: enc/hashing.md
    - Languages: enc/languages.md
    - Obfuscation: enc/obfuscation.md
    - Others: enc/others.md
    - Steganography: enc/stegano.md
    - Web: enc/web.md
  - 'String manipulations': manipulations.md
  - 'CLI tool': cli.md
  - 'Create your codec': howto.md
  - Contributing: contributing.md
extra:
  generator: false
  social:
    - icon: fontawesome/solid/paper-plane
      link: mailto:alexandre.dhondt@gmail.com
      name: Contact Alex
    - icon: fontawesome/brands/github
      link: https://github.com/dhondta
      name: Alex on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/alexandre-d-2ab2aa14/
      name: Alex on LinkedIn
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/alex_dhondt
      name: Alex on Twitter
extra_css:
  - css/extra.css
theme:
  name: material
  logo: img/logo.png
  favicon: img/icon.png
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - toc.follow
use_directory_urls: false
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
