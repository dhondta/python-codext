[build-system]
requires = ["setuptools>=80.0.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "codext.__info__.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.coverage.run]
source = ["codext"]
omit = [
  "src/codext/__info__.py",
  "src/codext/__main__.py",
  "src/codext/**/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
  'pragma: no cover',
  'if.*?__name__.*?==.*?.__main__.:',
  'def main\(\)\:',
  'def __stdin_pipe\(\)\:',
  'for line in __stdin_pipe\(\)\:',
  'def __format_list\(items, include\=True\)\:',
  'def __print_tabular\(lst, space\=4\)\:',
  'except ImportError:',
  'except NameError:',
  'raise NotImplementedError',
  'def _detect\(text\)\:',
  'def _lang\(lang\)\:',
  'if stopfunc\.LANG_BACKEND\:',
  'def _validate\(stop_function, lang_backend\=\"none\"\)\:',
  'except KeyboardInterrupt\:',
  'if alt and len\(t\) \% 2 \=\= 1\:',
]

[project]
name = "codext"
authors = [
  {name="Alexandre D'Hondt", email="alexandre.dhondt@gmail.com"},
]
description = "Native codecs extension"
license = {file = "LICENSE"}
keywords = ["python", "development", "programming", "codecs", "encodings"]
requires-python = ">=3.10,<4"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "legacycrypt; python_version >= '3.13'",
  "markdown2>=2.5.4",
]
dynamic = ["version"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
documentation = "https://python-codext.readthedocs.io/en/latest/?badge=latest"
homepage = "https://github.com/dhondta/python-codext"
issues = "https://github.com/dhondta/python-codext/issues"
repository = "https://github.com/dhondta/python-codext"

